version: "3.9"

services:

  mongodb:
    image: mongo:7
    command: ["--quiet"]
    container_name: careslot-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    container_name: careslot-server
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    env_file:
      - ./server/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/careslot

  nginx:
    build: ./client
    container_name: careslot-nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo-data: